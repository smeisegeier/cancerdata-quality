/1999/xhtml">✅🔲 Vollständigkeit <strong>Personenangaben</strong></div></div></foreignObject></g><g data-depth="3" data-path="1.6.10" class="markmap-node markmap-fold" transform="translate(387, 58.4375)"><line stroke="#17becf" stroke-width="1.375" x1="-1" x2="334" y1="20.6875" y2="20.6875"/><circle stroke-width="1.5" r="6" stroke="#17becf" fill="#17becf" cx="332" cy="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="316" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">🔲🔲 Vollständigkeit <strong>Tumorangaben</strong> Anteile</div></div></foreignObject></g><g data-depth="2" data-path="1.6" class="markmap-node" transform="translate(116, 32.0625)"><line stroke="#8c564b" stroke-width="1.75" x1="-1" x2="193" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#8c564b" fill="var(--markmap-circle-open-bg)" cx="191" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="175" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Vollzähligkeitsschätzung</div></div></foreignObject></g><g data-depth="1" data-path="1" class="markmap-node" transform="translate(0, -10)"><line stroke="#1f77b4" stroke-width="2.5" x1="-1" x2="38" y1="21.25" y2="21.25"/><circle stroke-width="1.5" r="6" stroke="#1f77b4" fill="var(--markmap-circle-open-bg)" cx="36" cy="21.25"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="20" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">dq</div></div></foreignObject></g></g></svg>